name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decides whether to publish a release: for a pushed tag such as v1.2.2,
  # or when a push to main changes the VERSION file to a version that has
  # no release yet.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(tr -d ' \r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::Building and publishing DescTrack $V"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gir1.2-webkit2-4.1 gir1.2-girepository-3.0 \
            libgirepository-2.0-dev libcairo2-dev pkg-config xvfb dbus-x11 at-spi2-core

      - name: Install ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependencies for known vulnerabilities
        # Audits everything installed above. Retries once in case PyPI's
        # advisory service is briefly unreachable, and shows any findings
        # as annotations on the run.
        run: |
          pip-audit --progress-spinner off > audit.txt 2>&1 || { sleep 20; pip-audit --progress-spinner off > audit.txt 2>&1; } || {
            cat audit.txt
            tail -n 20 audit.txt | while IFS= read -r line; do echo "::error title=pip-audit::$line"; done
            exit 1
          }
          cat audit.txt

      - name: Run the tests
        run: python -m pytest -v

      - name: Build the app
        run: pyinstaller --noconfirm --clean desctrack.spec

      - name: Check the built app starts
        env:
          DESCTRACK_PORT: "5891"
        run: |
          case "$RUNNER_OS" in
            Linux)   APP=(xvfb-run -a dbus-run-session -- dist/DescTrack) ;;
            macOS)   APP=(dist/DescTrack.app/Contents/MacOS/DescTrack) ;;
            Windows) APP=(dist/DescTrack.exe) ;;
          esac
          "${APP[@]}" > app.log 2>&1 &
          PID=$!
          ok=""
          for i in $(seq 90); do
            if curl -sf http://127.0.0.1:5891/api/status; then ok=1; break; fi
            sleep 1
          done
          echo
          # The window starts after the server; make sure the app is still
          # running (i.e. the native window opened rather than crashing).
          sleep 10
          alive=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            tasklist //FI "IMAGENAME eq DescTrack.exe" | grep -qi DescTrack.exe && alive=1
            taskkill //F //IM DescTrack.exe || true
          else
            kill -0 "$PID" 2>/dev/null && alive=1
            pkill -f "dist/DescTrack" || true
          fi
          cat app.log || true
          [ -n "$ok" ] && [ -n "$alive" ]

      - name: Package the download
        run: |
          mkdir -p release
          case "$RUNNER_OS" in
            Linux)   tar -czf release/DescTrack-linux-x86_64.tar.gz -C dist DescTrack ;;
            macOS)   ditto -c -k --keepParent dist/DescTrack.app release/DescTrack-mac.zip ;;
            Windows) powershell -Command "Compress-Archive -Path dist/DescTrack.exe -DestinationPath release/DescTrack-windows.zip" ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: DescTrack-${{ matrix.name }}
          path: release/*

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            if [ -f "release-notes/$TAG.md" ]; then NOTES="--notes-file release-notes/$TAG.md"; else NOTES="--generate-notes"; fi
            # Creates the tag too, on the commit that was built.
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DescTrack $TAG" $NOTES
          fi
